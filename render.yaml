# Render Blueprint for BALATravel — deploys BOTH the FastAPI backend and the
# Next.js frontend as separate web services from this one repo, on the FREE tier.
# Deploy via: Render Dashboard > New > Blueprint > point at this repo.
#
# IMPORTANT — data is EPHEMERAL on the free tier:
#   The free tier has no persistent disk, so the SQLite file lives in /tmp and is
#   WIPED on every deploy/restart (and free services sleep after ~15 min idle).
#   All accounts and trips reset. Fine for a demo. To keep data permanently, see
#   DEPLOY.md (add a persistent disk on the paid Starter plan, or use a free
#   hosted Postgres).

services:
  # ---------------------------------------------------------------------------
  # Backend — FastAPI (persistent process; needed for background threads + SQLite)
  # ---------------------------------------------------------------------------
  - type: web
    name: balatravel-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      # Ephemeral SQLite in /tmp (free tier has no persistent disk; 4 slashes =
      # absolute path). The schema auto-creates on boot, so this resets clean.
      - key: DATABASE_URL
        value: sqlite:////tmp/balatravel.db
      # Must list the frontend's PUBLIC URL (browser -> backend is cross-origin).
      # NOTE: this var is Blueprint-managed, so this value is the source of truth —
      # editing it in the Render dashboard gets reverted on sync. Change it here.
      - key: CORS_ORIGINS
        value: https://balatravel-web.onrender.com,http://localhost:3000
      # Auto-generated strong secret for signing JWTs.
      - key: SECRET_KEY
        generateValue: true
      # --- LLM + external APIs: set these as secrets in the Render dashboard ---
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: GOOGLE_ROUTES_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: OPENTRIPMAP_API_KEY
        sync: false

  # ---------------------------------------------------------------------------
  # Frontend — Next.js (runs `next start` as a persistent Node server)
  # ---------------------------------------------------------------------------
  - type: web
    name: balatravel-web
    runtime: node
    plan: free               # bump to `starter` to avoid cold-start sleeps
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- --port $PORT
    envVars:
      # NEXT_PUBLIC_* is inlined into the browser bundle at BUILD time, so it
      # must be the backend's PUBLIC URL (with the /api suffix), not an internal
      # one. Set this to the balatravel-api URL after its first deploy, e.g.
      #   https://balatravel-api.onrender.com/api
      # Changing it requires a redeploy of this service to take effect.
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
        sync: false
